name: VPN Gate Node Check

on:
  schedule:
    # 每 12 小时运行一次：UTC 00:37 和 12:37（北京时间 08:37 和 20:37）
    - cron: '37 */12 * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 abc.workers.dev）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '32' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
          MAX_RESIDENTIAL_PER_COUNTRY: '50'
          MAX_DATACENTER_PER_COUNTRY: '2'
        run: python vpngate.py

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET ${api} -> ${status}"

          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi

          if [ "${status}" = "404" ]; then
            # 创建站点必须用 POST，且 workflow 构建类型不接受 source 字段
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST ${api} -> ${create}"
            case "${create}" in
              201|204|409)
                echo "GitHub Pages 已启用（或已存在），等待生效"
                sleep 10
                exit 0
                ;;
              *)
                echo "::error::自动启用 Pages 失败（HTTP ${create}）。请打开仓库 Settings → Pages，把 Source 选为 GitHub Actions，然后重新运行本工作流。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi

          echo "::error::查询 Pages 状态失败（HTTP ${status}），请检查仓库 Pages 设置或工作流权限。"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # 工件元数据 API 偶发最终一致性抖动（Found 0 artifact(s)），先失败不判红，交给下一步重试
        continue-on-error: true
        timeout-minutes: 10

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        timeout-minutes: 10

      - name: Fail if deploy failed twice
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages 连续两次部署失败，请手动重跑本工作流（不是流水线问题）。"
          exit 1

      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
